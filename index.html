<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body class="dark">

<header class="topbar glass site-header">
  <!-- SVG LOGO -->
  <svg
    class="logo"
    width="180"
    height="36"
    viewBox="0 0 180 36"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="RhymeScene"
  >
    <defs>
      <linearGradient id="sceneGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9B6CFF" />
        <stop offset="100%" stop-color="#3B82F6" />
      </linearGradient>
    </defs>

    <text x="0" y="26" fill="#FFFFFF" font-size="26" font-weight="700"
      font-family="Inter, system-ui, -apple-system, sans-serif">
      Rhyme
    </text>

    <text x="78" y="26" fill="url(#sceneGradient)" font-size="26" font-weight="700"
      font-family="Inter, system-ui, -apple-system, sans-serif">
      Scene
    </text>
  </svg>
</header>

<main class="layout">

  <!-- CENTER -->
  <section class="lyrics-area">
    <div class="lyrics-sheet glass">
      <button id="lockBtn" class="lock-btn hidden">Edit</button>

      <div class="field">
        <div id="titlePh" class="placeholder">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <div class="field">
        <div id="lyricsPh" class="placeholder">Type your lyrics here…</div>
        <div id="lyrics" class="lyrics" contenteditable="true"></div>
      </div>
    </div>
  </section>

  <!-- RIGHT PANEL -->
  <aside id="analysisPanel" class="analysis-panel">

    <!-- FIXED TOP -->
    <div class="panel-top glass">
      <h3 class="panel-heading">Analysis</h3>
    </div>

    <!-- SCROLL AREA -->
    <div class="panel-scroll">

      <button id="feedbackBtn" class="feedback-btn dim">
        Feedback
      </button>

      <section id="feedbackSection" class="feedback-section hidden"></section>

      <section id="categoriesSection" class="categories hidden">

        <!-- WORD -->
        <div class="category">
          <div class="category-title">Word Replacement</div>
          <div class="category-content"></div>
        </div>

        <!-- RHYME -->
        <div class="category">
          <div class="category-title">Rhymes</div>
          <div class="category-content"></div>
        </div>

        <!-- FLOW -->
        <div class="category">
          <div class="category-title">Flow & Cadence</div>
          <div class="category-content"></div>
        </div>

        <!-- IMAGERY -->
        <div class="category">
          <div class="category-title">Imagery</div>
          <div class="category-content"></div>
        </div>

        <!-- CLICHE -->
        <div class="category">
          <div class="category-title">Cliché</div>
          <div class="category-content"></div>
        </div>

        <!-- EMOTION -->
        <div class="category">
          <div class="category-title">Emotional Depth</div>
          <div class="category-content"></div>
        </div>

        <!-- REFINEMENT -->
        <div class="category">
          <div class="category-title">Refinement</div>
          <div class="category-content"></div>
        </div>

      </section>
    </div>

    <!-- FIXED BOTTOM -->
    <div class="panel-bottom glass">
      <button id="analyzeBtn" class="analyze-btn dim">
        Analyze
      </button>
    </div>

  </aside>

</main>

<script src="https://js.puter.com/v2/"></script>
<script src="app.js"></script>
</body>
</html>
