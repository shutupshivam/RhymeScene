<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body>

<!-- APP -->
<div id="app">

  <!-- TOP BAR -->
  <header class="topbar glass slide-down">
    <div class="categories">
      <div class="chip active">Word</div>
      <div class="chip">Rhyme</div>
      <div class="chip">Flow</div>
      <div class="chip">Imagery</div>
      <div class="chip">Emotion</div>
      <div class="chip more">More</div>
    </div>

    <div class="actions">
      <button id="analyzeBtn" class="btn analyze disabled" disabled>
        Analyze
      </button>
      <button id="editBtn" class="btn ghost">
        Edit
      </button>
      <button id="settingsBtn" class="icon-btn">
        ⚙︎
      </button>
    </div>
  </header>

  <!-- SETTINGS PANEL -->
  <div id="settingsPanel" class="settings glass fade-in">
    <h4>Settings</h4>

    <label>
      Theme
      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>

    <label>
      Text size
      <input type="range" id="fontSize" min="16" max="24" value="18" />
    </label>

    <label>
      Line spacing
      <input type="range" id="lineHeight" min="1.4" max="2" step="0.1" value="1.7" />
    </label>
  </div>

  <!-- WORKSPACE -->
  <main class="workspace fade-in">

    <div class="sheet glass">

      <!-- TITLE -->
      <div class="field title-wrap">
        <div class="placeholder" id="titlePlaceholder">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <!-- LYRICS -->
      <div class="field lyrics-wrap">
        <div class="placeholder" id="lyricsPlaceholder">
          Type your lyrics here…
        </div>
        <div
          id="lyrics"
          class="lyrics"
          contenteditable="true"
          spellcheck="false"
        ></div>
      </div>

    </div>

  </main>

</div>

<script src="context.js"></script>
<script src="app.js"></script>
</body>
</html>
