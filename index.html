<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body>

<!-- TOP BAR -->
<header class="topbar glass">
  <div class="logo">
    <span class="logo-dot"></span>
    Rhyme Scene
  </div>
  <button id="settingsBtn" class="icon-btn">⚙︎</button>
</header>

<!-- SETTINGS PANEL -->
<div id="settingsPanel" class="settings glass">
  <h4>Settings</h4>

  <label>
    Theme
    <select id="themeSelect">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </label>

  <label>
    Text size
    <input type="range" id="fontSize" min="15" max="22" value="17">
  </label>

  <label>
    Line spacing
    <input type="range" id="lineHeight" min="1.3" max="1.9" step="0.1" value="1.5">
  </label>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LYRICS SHEET -->
  <section class="sheet-wrap">
    <div class="sheet glass">

      <!-- EDIT ICON -->
      <button id="editToggle" class="edit-toggle hidden" title="Edit lyrics">
        ✎
      </button>

      <!-- TITLE -->
      <div class="field title-wrap">
        <div class="placeholder" id="titlePlaceholder">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <!-- LYRICS -->
      <div class="field lyrics-wrap">
        <div class="placeholder" id="lyricsPlaceholder">
          Type your lyrics here…
        </div>
        <div id="lyrics" class="lyrics" contenteditable="true" spellcheck="false"></div>
      </div>

    </div>
  </section>

  <!-- ANALYSIS PANEL -->
  <aside class="analysis glass">

    <!-- TAGS -->
    <div class="tags">
      <div class="tag active">Word</div>
      <div class="tag">Rhyme</div>
      <div class="tag">Flow</div>
      <div class="tag">Emotion</div>
      <div class="tag">Imagery</div>
      <div class="tag">Cliché</div>
      <div class="tag">Overview</div>
    </div>

    <!-- EMPTY STATE -->
    <div class="analysis-empty">
      Select what you want to explore.
    </div>

    <!-- ANALYZE BUTTON -->
    <button id="analyzeBtn" class="analyze-btn disabled">
      Analyze
    </button>

  </aside>

</div>

<script src="context.js"></script>
<script src="app.js"></script>
</body>
</html>
