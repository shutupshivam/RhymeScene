<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body class="dark">

<header class="topbar glass">
  <div class="logo">
    <span class="logo-dot"></span>
    Rhyme Scene
  </div>

  <!-- TEXT SETTINGS -->
  <div class="text-controls">
    <label>
      A
      <input id="fontSize" type="range" min="14" max="22" value="16">
    </label>
    <label>
      ⇕
      <input id="lineHeight" type="range" min="1.2" max="2" step="0.1" value="1.45">
    </label>
  </div>
</header>

<main class="layout">

  <!-- LYRICS -->
  <section class="lyrics-area">
    <div class="lyrics-sheet glass">

      <button id="editToggle" class="edit-btn hidden">✎</button>

      <div class="field">
        <div class="placeholder" id="titlePh">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <div class="field">
        <div class="placeholder" id="lyricsPh">Type your lyrics here…</div>
        <div id="lyrics" class="lyrics" contenteditable="true"></div>
      </div>

    </div>
  </section>

  <!-- ANALYSIS PANEL -->
  <aside class="analysis-panel glass">
    <div class="panel-header">Analysis</div>

    <div id="categories" class="categories"></div>

    <button id="analyzeBtn" class="analyze-btn disabled">
      Analyze
    </button>
  </aside>

</main>

<!-- ✅ REQUIRED FOR GPT-5.2 -->
<script src="https://js.puter.com/v2/"></script>

<script src="context.js"></script>
<script src="app.js"></script>
</body>
</html>
