<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body class="dark">

<header class="topbar glass">
  <div class="logo">
    <img src="logo.png" alt="Rhyme Scene" />
  </div>
</header>

<main class="layout">

  <!-- CENTER -->
  <section class="lyrics-area">
    <div class="lyrics-sheet glass">
      <button id="lockBtn" class="lock-btn hidden">Edit</button>

      <div class="field">
        <div id="titlePh" class="placeholder">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <div class="field">
        <div id="lyricsPh" class="placeholder">Type your lyrics here…</div>
        <div id="lyrics" class="lyrics" contenteditable="true"></div>
      </div>
    </div>
  </section>

  <!-- RIGHT -->
  <aside class="analysis-panel glass">

    <!-- FIXED -->
    <button id="analyzeBtn" class="analyze-btn disabled glow-idle">
      Analyze
    </button>

    <!-- SCROLL -->
    <div class="panel-scroll">

      <button id="feedbackBtn" class="feedback-btn">
        Feedback
      </button>

      <section id="feedbackSection" class="feedback-section hidden fade-in"></section>

      <section id="categoriesSection" class="categories-section">

        <div class="category" data-cat="word">
          <div class="category-title">Word Replacement</div>
          <div class="category-content"></div>
        </div>

        <div class="category" data-cat="rhyme">
          <div class="category-title">Rhymes</div>
          <div class="category-content"></div>
        </div>

        <div class="category" data-cat="flow">
          <div class="category-title">Flow & Cadence</div>
          <div class="category-content"></div>
        </div>

        <div class="category" data-cat="imagery">
          <div class="category-title">Imagery</div>
          <div class="category-content"></div>
        </div>

      </section>
    </div>
  </aside>

</main>

<script src="https://js.puter.com/v2/"></script>
<script src="app.js"></script>
</body>
</html>
