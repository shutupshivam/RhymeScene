<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhyme Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="animations.css" />
</head>

<body class="dark">

<header class="topbar glass">
  <div class="logo">
    <img src="logo.png" />
  </div>
</header>

<main class="layout">

  <!-- LYRICS -->
  <section class="lyrics-area">
    <div class="lyrics-sheet glass">

      <button id="lockBtn" class="lock-btn hidden">Edit</button>

      <div class="field">
        <div id="titlePh" class="placeholder">Title</div>
        <div id="title" class="title" contenteditable="true"></div>
      </div>

      <div class="field">
        <div id="lyricsPh" class="placeholder">Type your lyrics here…</div>
        <div id="lyrics" class="lyrics" contenteditable="true"></div>
      </div>

    </div>
  </section>

  <!-- RESIZER -->
  <div id="resizeHandle"></div>

  <!-- ANALYSIS PANEL -->
  <aside id="analysisPanel" class="analysis-panel glass">
    <div id="lineIsland" class="line-island hidden">
      <button id="explainLine">Explain</button>
      <button id="replaceLine">Replace</button>
    </div>

    <div id="linePanel" class="line-panel hidden"></div>

    <div class="panel-header">Analysis</div>
    <div id="categories" class="categories"></div>

    <button id="analyzeBtn" class="analyze-btn disabled">Analyze</button>
  </aside>

</main>

<script src="https://js.puter.com/v2/"></script>
<script src="context.js"></script>
<script src="app.js"></script>
</body>
</html>
